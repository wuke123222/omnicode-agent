name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests, build, and verify IDE compatibility
        run: ./gradlew --no-daemon check buildPlugin verifyPlugin

      - name: Upload plugin ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnicode-agent-plugin
          path: build/distributions/*.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 7
