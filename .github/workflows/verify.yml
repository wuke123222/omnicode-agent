name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests, build, and verify IDE compatibility
        run: |
          set +e
          ./gradlew --no-daemon check buildPlugin verifyPlugin 2>&1 | tee gradle-output.log
          gradle_exit=${PIPESTATUS[0]}
          set -e

          if [ "$gradle_exit" -ne 0 ]; then
            failure_tail="$(tail -n 60 gradle-output.log | tr '\n' ' ' | cut -c 1-8000)"
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            echo "::error title=Gradle verification failed::$failure_tail"
          fi

          exit "$gradle_exit"

      - name: Upload plugin ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnicode-agent-plugin
          path: build/distributions/*.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 7
