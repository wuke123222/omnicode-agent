name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform-smoke:
    name: Cross-platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Run platform smoke tests
        shell: bash
        run: ./gradlew --no-daemon --console=plain test --tests 'dev.omnicode.*'

  test-and-package:
    name: Test and package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Run tests and build plugin
        run: |
          set +e
          ./gradlew --no-daemon check buildPlugin 2>&1 | tee gradle-output.log
          gradle_exit=${PIPESTATUS[0]}
          set -e

          if [ "$gradle_exit" -ne 0 ]; then
            failure_tail="$(tail -n 60 gradle-output.log | tr '\n' ' ' | cut -c 1-8000)"
            failure_tail="${failure_tail//'%'/'%25'}"
            failure_tail="${failure_tail//$'\r'/'%0D'}"
            echo "::error title=Gradle check or build failed::$failure_tail"
          fi

          exit "$gradle_exit"

      - name: Generate dependency SBOM
        run: ./gradlew --no-daemon --no-configuration-cache supplyChainSbom

      - name: Upload plugin ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omnicode-agent-plugin
          path: build/distributions/*.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omnicode-sbom
          path: build/reports/supply-chain/omnicode-sbom.json
          if-no-files-found: ignore
          retention-days: 30

  verify-products:
    name: Verify ${{ matrix.product }} compatibility
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: IntelliJ IDEA 2025.3
            target: idea-253
          - product: IntelliJ IDEA 2026.1
            target: idea-261
          - product: IntelliJ IDEA 2026.2
            target: idea-262
          - product: PyCharm 2025.3
            target: pycharm-253
          - product: WebStorm 2025.3
            target: webstorm-253
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Run Plugin Verifier
        run: ./gradlew --no-daemon verifyPlugin -PpluginVerifierIde="${{ matrix.target }}"

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-verifier-${{ matrix.target }}
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 7
