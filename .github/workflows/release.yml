name: Publish to JetBrains Marketplace

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-package:
    name: Test and package tagged source
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Build Windows AppContainer host for the plugin ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native/windows -B native/windows/build -A x64
          cmake --build native/windows/build --config Release --parallel --verbose
          $helper = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-host.exe'
          if (-not (Test-Path -LiteralPath $helper)) {
            # Visual Studio generators may add a configuration directory despite the
            # output-directory property. Normalize the binary to the path consumed by
            # Gradle and the plugin resource task instead of failing on a layout detail.
            $built = Get-ChildItem -Path (Join-Path $PWD 'native/windows/build') -Filter 'omnicode-appcontainer-host.exe' -File -Recurse |
              Where-Object { $_.FullName -match '[\\/]Release[\\/]|[\\/]bin[\\/]' } |
              Select-Object -First 1
            if ($null -eq $built) {
              Get-ChildItem -Path (Join-Path $PWD 'native/windows/build') -File -Recurse | Select-Object -ExpandProperty FullName
              throw 'Windows AppContainer helper was not produced by CMake'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $helper) | Out-Null
            Copy-Item -LiteralPath $built.FullName -Destination $helper -Force
          }
          & $helper --probe
          if ($LASTEXITCODE -ne 0) { throw "AppContainer API probe failed: $LASTEXITCODE" }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $helper).Hash.ToLowerInvariant() | Set-Content -NoNewline "$helper.sha256"

      - name: Check tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(./gradlew --no-daemon --console=plain -q properties | sed -n 's/^version: //p' | head -n 1)"
          if [[ -z "$project_version" || "$tag_version" != "$project_version" ]]; then
            echo "::error::Tag version '$tag_version' does not match Gradle version '$project_version'."
            exit 1
          fi

      - name: Run checks and build plugin
        run: .\gradlew.bat --no-daemon check buildPlugin

      - name: Generate dependency SBOM
        run: .\gradlew.bat --no-daemon --no-configuration-cache supplyChainSbom

      - name: Upload unsigned plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-omnicode-sbom
          path: build/reports/supply-chain/omnicode-sbom.json
          if-no-files-found: error
          retention-days: 30

  verify-products:
    name: Verify ${{ matrix.product }} compatibility
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: IntelliJ IDEA 2025.3
            target: idea-253
          - product: IntelliJ IDEA 2026.1
            target: idea-261
          - product: IntelliJ IDEA 2026.2
            target: idea-262
          - product: PyCharm 2025.3
            target: pycharm-253
          - product: WebStorm 2025.3
            target: webstorm-253
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Run Plugin Verifier
        run: ./gradlew --no-daemon verifyPlugin -PpluginVerifierIde="${{ matrix.target }}"

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-plugin-verifier-${{ matrix.target }}
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 14

  sign-and-publish:
    name: Sign, verify signature, and publish
    needs: verify-products
    runs-on: windows-2022
    timeout-minutes: 20
    environment:
      name: jetbrains-marketplace
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Build Windows AppContainer host for the signed ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native/windows -B native/windows/build -A x64
          cmake --build native/windows/build --config Release --parallel --verbose
          $helper = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-host.exe'
          if (-not (Test-Path -LiteralPath $helper)) {
            $built = Get-ChildItem -Path (Join-Path $PWD 'native/windows/build') -Filter 'omnicode-appcontainer-host.exe' -File -Recurse |
              Where-Object { $_.FullName -match '[\\/]Release[\\/]|[\\/]bin[\\/]' } |
              Select-Object -First 1
            if ($null -eq $built) {
              Get-ChildItem -Path (Join-Path $PWD 'native/windows/build') -File -Recurse | Select-Object -ExpandProperty FullName
              throw 'Windows AppContainer helper was not produced by CMake'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $helper) | Out-Null
            Copy-Item -LiteralPath $built.FullName -Destination $helper -Force
          }
          & $helper --probe
          if ($LASTEXITCODE -ne 0) { throw "AppContainer API probe failed: $LASTEXITCODE" }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $helper).Hash.ToLowerInvariant() | Set-Content -NoNewline "$helper.sha256"

      - name: Check release secrets are present
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CERTIFICATE_CHAIN" ]] || missing+=(CERTIFICATE_CHAIN)
          [[ -n "$PRIVATE_KEY" ]] || missing+=(PRIVATE_KEY)
          [[ -n "$PRIVATE_KEY_PASSWORD" ]] || missing+=(PRIVATE_KEY_PASSWORD)
          [[ -n "$PUBLISH_TOKEN" ]] || missing+=(PUBLISH_TOKEN)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Marketplace environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Prepare signing material files
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          certificate_file="$RUNNER_TEMP/omnicode-marketplace-chain.pem"
          private_key_file="$RUNNER_TEMP/omnicode-marketplace-private.pem"
          install -m 600 /dev/null "$certificate_file"
          install -m 600 /dev/null "$private_key_file"
          printf '%s' "$CERTIFICATE_CHAIN" > "$certificate_file"
          printf '%s' "$PRIVATE_KEY" > "$private_key_file"
          echo "CERTIFICATE_CHAIN_FILE=$certificate_file" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY_FILE=$private_key_file" >> "$GITHUB_ENV"

      - name: Sign plugin and verify signature
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: .\gradlew.bat --no-daemon --no-configuration-cache --no-build-cache signPlugin verifyPluginSignature

      - name: Upload signed plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-plugin
          path: build/distributions/*-signed.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed plugin to Marketplace
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: .\gradlew.bat --no-daemon --no-configuration-cache --no-build-cache publishPlugin

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for signing_file in "${CERTIFICATE_CHAIN_FILE:-}" "${PRIVATE_KEY_FILE:-}"; do
            [[ -z "$signing_file" ]] || rm -f -- "$signing_file"
          done
