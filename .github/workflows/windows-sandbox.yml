name: Native Windows AppContainer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appcontainer-host:
    name: Build and exercise native AppContainer host
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure native host
        shell: pwsh
        run: cmake -S native/windows -B native/windows/build -A x64

      - name: Build native host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build native/windows/build --config Release --parallel --verbose
          $helper = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-host.exe'
          if (-not (Test-Path -LiteralPath $helper)) {
            $built = Get-ChildItem -Path (Join-Path $PWD 'native/windows/build') -Filter 'omnicode-appcontainer-host.exe' -File -Recurse |
              Where-Object { $_.FullName -match '[\\/]Release[\\/]|[\\/]bin[\\/]' } |
              Select-Object -First 1
            if ($null -eq $built) {
              Get-ChildItem -Path (Join-Path $PWD 'native/windows/build') -File -Recurse | Select-Object -ExpandProperty FullName
              throw 'Windows AppContainer helper was not produced by CMake'
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $helper) | Out-Null
            Copy-Item -LiteralPath $built.FullName -Destination $helper -Force
          }

      - name: Probe AppContainer APIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-host.exe'
          & $helper --probe
          if ($LASTEXITCODE -ne 0) { throw "AppContainer API probe failed: $LASTEXITCODE" }

      - name: Exercise workspace ACL transaction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OMNICODE_APPCONTAINER_DIAGNOSTICS = '1'
          $helper = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-host.exe'
          $workspace = Join-Path $env:RUNNER_TEMP 'omnicode-appcontainer-workspace'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          Set-Content -LiteralPath (Join-Path $workspace 'input.txt') -Value 'omnicode'
          $smoke = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-smoke-child.exe'
          if (-not (Test-Path -LiteralPath $smoke)) { throw 'AppContainer smoke child was not produced by CMake' }
          # Use the inbox command interpreter to exercise child launch and the writable ACL
          # transaction. Run a no-stdio control first to isolate handle inheritance failures.
          $cmd = Join-Path $env:SystemRoot 'System32/cmd.exe'
          & $helper --workspace $workspace --cwd $workspace --read-write --no-stdio -- $smoke
          if ($LASTEXITCODE -ne 0) { throw "workspace AppContainer native-child diagnostic failed: $LASTEXITCODE" }
          & $helper --workspace $workspace --cwd $workspace --read-write --no-stdio -- $cmd '/d' '/c' 'exit /b 0'
          if ($LASTEXITCODE -ne 0) { throw "workspace AppContainer no-stdio command smoke failed: $LASTEXITCODE" }
          & $helper --workspace $workspace --cwd $workspace --read-write -- $smoke '--stdio'
          if ($LASTEXITCODE -ne 0) { throw "workspace AppContainer smoke failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $workspace 'input.txt'))) { throw 'workspace disappeared' }

          # The broker must pass an explicit environment block rather than inheriting the IDE
          # process. Set a sentinel in the runner and prove the child cannot observe it.
          $env:OMNICODE_TEST_SECRET = 'must-not-cross-the-boundary'
          try {
            & $helper --workspace $workspace --cwd $workspace --read-only -- $smoke '--assert-secret-absent'
            if ($LASTEXITCODE -ne 0) { throw "AppContainer environment isolation smoke failed: $LASTEXITCODE" }
          } finally {
            Remove-Item Env:OMNICODE_TEST_SECRET -ErrorAction SilentlyContinue
          }

      - name: Exercise as a normal (non-administrator) user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows local account names are limited to 20 characters.
          $user = 'omnicode-ci-user'
          $password = ConvertTo-SecureString 'OmniCode-ci-Only-2026!' -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $user
          }
          New-LocalUser -Name $user -Password $password -AccountNeverExpires -PasswordNeverExpires | Out-Null
          # Start-Process -LoadUserProfile loads an existing profile, but a freshly
          # created local account may not have a ProfileList entry / LocalAppData
          # known-folder mapping yet. Create the real Windows profile as the runner
          # administrator so the test exercises the same identity environment as a
          # normal first login rather than weakening the AppContainer host fallback.
          Add-Type -TypeDefinition @'
          using System.Runtime.InteropServices;
          using System.Text;
          public static class OmniCodeUserProfileNative {
              [DllImport("userenv.dll", CharSet = CharSet.Unicode, ExactSpelling = true)]
              public static extern int CreateProfile(
                  [MarshalAs(UnmanagedType.LPWStr)] string userSid,
                  [MarshalAs(UnmanagedType.LPWStr)] string userName,
                  [Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder profilePath,
                  uint pathLength);
          }
          '@
          $sid = (Get-LocalUser -Name $user).SID.Value
          # CreateProfile's output path buffer is MAX_PATH-sized; larger buffers
          # are rejected by Windows with HRESULT_FROM_WIN32(RPC_X_BAD_STUB_DATA).
          $profilePath = [System.Text.StringBuilder]::new(260)
          $profileResult = [OmniCodeUserProfileNative]::CreateProfile($sid, $user, $profilePath, [uint32]$profilePath.Capacity)
          # HRESULT_FROM_WIN32(ERROR_ALREADY_EXISTS) is safe only when the profile
          # registration exists; all other failures must stop this security test.
          $profileAlreadyExists = $profileResult -eq -2147024713
          if ($profileResult -ne 0 -and -not $profileAlreadyExists) {
            throw "CreateProfile failed for the standard-user test account (HRESULT $profileResult)"
          }
          $userProfileDirectory = if ($profileResult -eq 0) {
            $profilePath.ToString()
          } else {
            $profileKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"
            $registeredPath = (Get-ItemProperty -LiteralPath $profileKey -Name ProfileImagePath -ErrorAction Stop).ProfileImagePath
            [Environment]::ExpandEnvironmentVariables($registeredPath)
          }
          if ([string]::IsNullOrWhiteSpace($userProfileDirectory) -or -not (Test-Path -LiteralPath $userProfileDirectory)) {
            throw 'CreateProfile did not produce an accessible standard-user profile directory'
          }
          $workspace = Join-Path $env:RUNNER_TEMP 'omnicode-appcontainer-standard-user'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          Set-Content -LiteralPath (Join-Path $workspace 'input.txt') -Value 'omnicode'
          # A real user's project tree is owned by that user; granting Modify alone
          # does not grant WRITE_DAC on an administrator-owned tree.
          icacls $workspace /setowner $user /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not assign the test workspace to its owner' }
          icacls $workspace /grant "${user}:(OI)(CI)M" /T | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'could not grant the test user workspace access' }
          $standardUserTemp = Join-Path $env:RUNNER_TEMP 'omnicode-appcontainer-standard-user-temp'
          New-Item -ItemType Directory -Force -Path $standardUserTemp | Out-Null
          icacls $standardUserTemp /grant "${user}:(OI)(CI)M" /T | Out-Null
          $helper = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-host.exe'
          $smoke = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-smoke-child.exe'
          $argumentList = @('--workspace', $workspace, '--cwd', $workspace, '--read-write', '--', $smoke, '--stdio')
          $stdout = Join-Path $env:RUNNER_TEMP 'omnicode-standard-user.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'omnicode-standard-user.stderr.log'
          # Start-Process inherits the runner's environment by default, even when using
          # alternate credentials. Give the standard user a private writable temp root so
          # GetTempPathW never resolves to the runner administrator's directory.
          $process = Start-Process -FilePath $helper -Credential (New-Object PSCredential($user, $password)) -LoadUserProfile -Environment @{ TEMP = $standardUserTemp; TMP = $standardUserTemp; OMNICODE_APPCONTAINER_DIAGNOSTICS = '1' } -ArgumentList $argumentList -Wait -PassThru -WorkingDirectory $workspace -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $stdout) { Get-Content -Raw -LiteralPath $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content -Raw -LiteralPath $stderr }
            throw "standard-user AppContainer smoke failed: $($process.ExitCode)"
          }
          if (-not (Select-String -SimpleMatch 'OMNICODE_APPCONTAINER_STDIO_OK' -Quiet -LiteralPath $stdout)) {
            throw 'standard-user AppContainer smoke did not receive the child stdout marker'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $workspace 'input.txt'))) { throw 'standard-user workspace disappeared' }
          Remove-LocalUser -Name $user

      - name: Create helper hash sidecar
        shell: pwsh
        run: |
          $helper = Join-Path $PWD 'native/windows/build/bin/omnicode-appcontainer-host.exe'
          (Get-FileHash -Algorithm SHA256 -LiteralPath $helper).Hash.ToLowerInvariant() | Set-Content -NoNewline "$helper.sha256"

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Run Windows sandbox tests with the built helper
        shell: pwsh
        env:
          OMNICODE_APPCONTAINER_HOST: ${{ github.workspace }}\native\windows\build\bin\omnicode-appcontainer-host.exe
        run: .\gradlew.bat --no-daemon --console=plain test --tests dev.omnicode.tool.ProcessSandboxTest

      - name: Upload native helper evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnicode-windows-appcontainer-host
          path: |
            native/windows/build/bin/omnicode-appcontainer-host.exe
            native/windows/build/bin/omnicode-appcontainer-host.exe.sha256
          if-no-files-found: error
          retention-days: 14
