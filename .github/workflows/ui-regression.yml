name: UI regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-screenshots:
    name: React layout screenshot gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Install web dependencies and Chromium
        working-directory: webview
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run React screenshot regression
        working-directory: webview
        run: npm run test:visual

      - name: Upload screenshot evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-regression-reports
          path: |
            webview/test-results/
            webview/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  remote-robot:
    name: Real IntelliJ Remote Robot desktop smoke
    # Keep the real desktop flow on pull requests as well as manual runs. It opens the
    # fixture project, opens OmniCode, clicks Settings, and captures the resulting frame.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Start IDE with Robot Server and run remote client
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1600x1200x24 -ac >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          ide_pid=""
          trap 'kill "$ide_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          ./gradlew --no-daemon --console=plain runIdeForUiTests >"$RUNNER_TEMP/ide.log" 2>&1 &
          ide_pid=$!
          for attempt in $(seq 1 60); do
            if ! kill -0 "$ide_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/ide.log"
              exit 1
            fi
            if nc -z 127.0.0.1 8082 2>/dev/null; then break; fi
            sleep 2
          done
          nc -z 127.0.0.1 8082
          OMNICODE_REMOTE_ROBOT_URL=http://127.0.0.1:8082/ \
          OMNICODE_REMOTE_ROBOT_SCREENSHOT="$RUNNER_TEMP/omnicode-remote-robot.png" \
          ./gradlew --no-daemon --console=plain test --tests dev.omnicode.ui.RemoteRobotSmokeTest

      - name: Upload IDE and display logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-robot-logs
          path: |
            ${{ runner.temp }}/ide.log
            ${{ runner.temp }}/xvfb.log
            ${{ runner.temp }}/omnicode-remote-robot.png
          if-no-files-found: ignore
          retention-days: 14
