name: UI regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-screenshots:
    name: Deterministic Swing screenshot gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Run UI component screenshot regression
        run: xvfb-run --auto-servernum --server-args='-screen 0 1600x1200x24' ./gradlew --no-daemon --console=plain test --tests dev.omnicode.ui.UiScreenshotRegressionTest

      - name: Upload screenshot evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-regression-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  remote-robot:
    name: Real IntelliJ Remote Robot desktop smoke
    # Keep the real desktop flow on pull requests as well as manual runs. This catches
    # tool-window sizing, focus and click regressions before a Marketplace tag is cut.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      - name: Start IDE with Robot Server and run remote client
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1600x1200x24 -ac >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          ide_pid=""
          trap 'kill "$ide_pid" "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          ./gradlew --no-daemon --console=plain runIdeForUiTests >"$RUNNER_TEMP/ide.log" 2>&1 &
          ide_pid=$!
          for attempt in $(seq 1 60); do
            if ! kill -0 "$ide_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/ide.log"
              exit 1
            fi
            if nc -z 127.0.0.1 8082 2>/dev/null; then break; fi
            sleep 2
          done
          nc -z 127.0.0.1 8082
          OMNICODE_REMOTE_ROBOT_URL=http://127.0.0.1:8082/ ./gradlew --no-daemon --console=plain test --tests dev.omnicode.ui.RemoteRobotSmokeTest

      - name: Upload IDE and display logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-robot-logs
          path: |
            ${{ runner.temp }}/ide.log
            ${{ runner.temp }}/xvfb.log
          if-no-files-found: ignore
          retention-days: 14
