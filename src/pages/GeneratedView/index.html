<script>
    (() => {
        const feedPanel = document.getElementById('feed-panel');
        const roomGrid = document.getElementById('room-grid');

        document.querySelectorAll('.feedTab').forEach((tab) => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.feedTab').forEach((candidate) => {
                    const active = candidate === tab;
                    candidate.classList.toggle('feedTabActive', active);
                    candidate.setAttribute('aria-selected', String(active));
                });
                feedPanel.setAttribute('aria-labelledby', tab.id);
            });
        });

        document.querySelectorAll('.filterTab').forEach((tab) => {
            tab.addEventListener('click', () => {
                const filter = tab.dataset.filter;
                document.querySelectorAll('.filterTab').forEach((candidate) => {
                    const active = candidate === tab;
                    candidate.classList.toggle('filterTabActive', active);
                    candidate.setAttribute('aria-selected', String(active));
                });
                document.querySelectorAll('.roomCard').forEach((card) => {
                    card.hidden = filter !== 'All' && card.dataset.category !== filter;
                });
                roomGrid.setAttribute('aria-labelledby', tab.id);
            });
        });

        document.querySelectorAll('.bottomNavItem').forEach((item) => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.bottomNavItem').forEach((candidate) => {
                    const active = candidate === item;
                    candidate.classList.toggle('bottomNavItemActive', active);
                    if (active) candidate.setAttribute('aria-current', 'page');
                    else candidate.removeAttribute('aria-current');
                });
            });
        });

        document.querySelectorAll('img').forEach((image) => {
            image.addEventListener('error', () => {
                image.hidden = true;
            });
        });
    })();
</script>
